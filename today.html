<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="theme-color" content="#e9e3ff"><title>Today in AI · Gudiya's Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#1a1f36;--body:#3c4257;--mut:#697386;--ac:#635bff;--acbg:#f3f2ff;--bd:#e3e8ee;--bg:#f6f9fc}
*{box-sizing:border-box}body{margin:0;font:16px/1.65 Inter,system-ui,sans-serif;color:var(--body);-webkit-font-smoothing:antialiased}a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;gap:12px;align-items:center}.top b{color:var(--ink)}.top b span{color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:40px 22px 100px;animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.pill{display:inline-block;background:var(--acbg);color:var(--ac);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:4px 12px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-.02em;color:var(--ink);margin:14px 0 8px}.date{color:var(--mut);font-size:14px}
.card{border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin:18px 0}.card .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.say{background:linear-gradient(135deg,#f7f6ff,#fbfaf7);border-color:#e8e5fb;font-size:18px;color:var(--ink)}
.copy{font:600 12px Inter;border:1px solid var(--bd);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;margin-top:8px}
.embed{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
ul.arch{list-style:none;padding:0}ul.arch li{border-top:1px solid var(--bd);padding:10px 0}ul.arch .m{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;transition:.3s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<header class="top"><a href="./">← Roadmap</a><a href="./" style="color:var(--ink);font-weight:700;text-decoration:none">Gudiya's <span style="color:var(--ac)">AI Roadmap</span></a><b style="margin-left:auto">Today in <span>AI</span></b></header>
<main id="m"><p class="date">Loading…</p></main><div class="toast" role="status"></div>
<script>
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
fetch('today.json?'+Date.now()).then(r=>r.json()).then(({items})=>{const id=new URLSearchParams(location.search).get('d');const t=items.find(i=>i.date===id)||items[0];
let h=`<span class="pill">${E(t.product)}</span><h1>${E(t.headline)}</h1><p class="date">${fmt(t.date)}</p><p>${E(t.explanation)}</p>
<div class="card"><div class="l">Why it matters for you</div>${E(t.why)}</div>
<div class="card say"><div class="l">Say this to your team</div>“${E(t.say)}”<br><button class="copy">Copy</button></div>`;
if(t.prompt)h+=`<div class="card"><div class="l">Try this prompt in ${E(t.tool||t.product)}</div><p style="white-space:pre-wrap">${E(t.prompt)}</p><button class="copy" id="cpp">📋 Copy prompt</button></div>`;
if(t.video)h+=`<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${E(t.video)}?rel=0" title="${E(t.video_title||'Video')}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div><p class="date">${E(t.video_title||'')} · <a href="https://www.youtube.com/watch?v=${E(t.video)}" target="_blank" rel="noopener">Open on YouTube ↗</a></p>`;
h+=`<p>Source: <a href="${E(t.source)}" target="_blank" rel="noopener">${E(t.source_label||t.source)}</a></p>`;
const past=items.filter(i=>i!==t);if(past.length)h+=`<h3>Earlier tips</h3><ul class="arch">${past.map(i=>`<li><a href="?d=${E(i.date)}">${E(i.headline)}</a><div class="m">${E(i.product)} · ${fmt(i.date)}</div></li>`).join('')}</ul>`;
document.getElementById('m').innerHTML=h;const P=document.getElementById('cpp');if(P)P.onclick=async()=>{try{await navigator.clipboard.writeText(t.prompt)}catch(e){}const T=document.querySelector('.toast');T.textContent='Copied!';T.classList.add('on');setTimeout(()=>T.classList.remove('on'),1800)};document.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(t.say)}catch(e){}const T=document.querySelector('.toast');T.textContent='Copied';T.classList.add('on');setTimeout(()=>T.classList.remove('on'),1800)};
}).catch(()=>{document.getElementById('m').innerHTML='<p>Today\'s tip is on its way. Please check back soon.</p>'});
</script></body></html>
