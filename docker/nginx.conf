server {
    listen 8080;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    # Redirects must stay relative: the published port is not the container's 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    location = / {
        return 302 /gudiya-ai/;
    }

    location = /gudiya-ai {
        return 302 /gudiya-ai/;
    }

    # Replaces the repo's config.js so a local copy never reaches the live Worker.
    location = /gudiya-ai/config.js {
        alias /etc/nginx/local/config.js;
    }

    # The whole repo is mounted, so block everything that is not the site.
    # Case-insensitive because the Windows bind mount may not be case-sensitive.
    location ~* (/\.|^/gudiya-ai/(docker(/|$)|claude\.md$)) {
        return 404;
    }

    location /gudiya-ai/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
